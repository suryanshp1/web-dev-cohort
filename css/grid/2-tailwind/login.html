<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="bg-zinc-950 text-zinc-100 min-h-screen flex justify-center items-center">
        <div class="w-full max-w-md border rounded-2xl border-zinc-100 p-8">
            <h2 class="text-center text-2xl font-bold">Login</h2>
            <form action="" class="space-y-10">
                <div>
                    <label class="block text-sm text-zinc-200 mb-1 mt-2" for="Email">Email</label>
                    <input
                        class="border border-zinc-400 w-full rounded-lg px-4 py-2 focus:outline-orange-500 focus:ring-2 focus:border-orange-500"
                        type="email" name="" placeholder="Enter your email" id="">
                </div>
                <div>
                    <label class="block text-sm text-zinc-200 mb-1 mt-2" for="Password">Password</label>
                    <input
                        class="border border-zinc-400 w-full rounded-lg px-4 py-2 focus:outline-orange-500 focus:ring-2 focus:border-orange-500"
                        type="password" name="" placeholder="*************" id="">
                </div>
                <button class="bg-orange-500 w-full py-2 rounded-sm hover:bg-orange-600">login</button>
            </form>
        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | OIDC Provider</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="card" x-data="loginForm()">
      <div class="header">
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
      </div>

      <form @submit.prevent="submitForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" x-model="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" x-model="password" required placeholder="••••••••">
        </div>

        <div x-show="error" class="error-msg" x-text="error" style="display: none;"></div>
        
        <input type="hidden" id="continue_uri" x-model="continue_uri">

        <button type="submit" class="btn" :disabled="loading">
          <span x-show="!loading">Sign In</span>
          <span x-show="loading">Authenticating...</span>
        </button>
      </form>

      <div class="footer">
        Don't have an account? <a href="/register.html">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    function loginForm() {
      return {
        email: '',
        password: '',
        error: '',
        loading: false,
        continue_uri: new URLSearchParams(window.location.search).get('continue_uri') || '',
        
        async submitForm() {
          this.loading = true;
          this.error = '';
          
          try {
            const res = await fetch('/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: this.email,
                password: this.password,
                continue_uri: this.continue_uri
              }),
              redirect: 'follow'
            });

            if (res.redirected) {
              window.location.href = res.url;
            } else if (!res.ok) {
              const data = await res.json();
              this.error = data.error || 'Authentication failed';
            }
          } catch (err) {
            this.error = 'Network error occurred';
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>

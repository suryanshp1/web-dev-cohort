<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 million checkboxes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --card: #111111;
            --border: #222222;
            --accent: #00ff88;
            --text: #ffffff;
            --muted: #888888;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(0, 255, 136, 0.12), transparent 40%),
                var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
            padding: 3rem;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        h1::after {
            content: " • 100 checkboxes";
            color: var(--muted);
            font-size: 1rem;
            font-weight: 500;
        }

        #container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 16px;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03),
                0 20px 60px rgba(0, 0, 0, 0.5);
        }

        input[type="checkbox"] {
            appearance: none;
            width: 32px;
            height: 32px;
            border: 2px solid #444;
            border-radius: 10px;
            background: #181818;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        input[type="checkbox"]:hover {
            border-color: var(--accent);
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.25);
        }

        input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: black;
            font-weight: bold;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            #container {
                padding: 1rem;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <h1>Checkboxes</h1>
    <div id="container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById("container");
        const CHECKBOX_COUNT = 100

        socket.on("client:checkbox:change", data => {
            console.log(`Socket server event `, data)
            const {index, checked} = data

            const input = document.getElementById(`checkbox-${index}`)
            if (input) {
                input.checked = checked
            }
        })

        window.addEventListener('load', async() => {
            const response = await fetch('/checkboxes', { method: 'GET' })
            const data = await response.json()
            if (data && data.checkboxes) {
                data.checkboxes.forEach((serverValue, index) => {
                    const input = document.createElement("input");

                    input.type = "checkbox";
                    input.id = `checkbox-${index}`
                    input.checked = serverValue
                    
                    input.addEventListener('change', event => {
                        const checked = event.target.checked
                        console.log('Checkbox changed', { index, checked})
                        socket.emit("client:checkbox:change", { index, checked })
                    })
                    container.appendChild(input);
                })
            }
        })

    </script>
</body>

</html>

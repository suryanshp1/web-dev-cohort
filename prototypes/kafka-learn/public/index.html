<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Sharing Application</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        #map {
            height: 90vh;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        const map = L.map('map').setView([51.505, -0.09], 13);

        const remoteMarkers = new Map()
        socket.on('server:location:update', (data) => {
            const { id, latitude, longitude } = data
            if (!remoteMarkers.has(id)) {
                const marker = L.marker([latitude, longitude])
                                    .addTo(map)
                                    .bindPopup(id)
                remoteMarkers.set(id, marker)
            } else {
                const existingMarker = remoteMarkers.get(id)
                existingMarker.setLatLng([latitude, longitude])
            }
        })

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        function getUsersCurrentLocation() {
            return new Promise((resolve, reject) => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            console.log(`Got user's current location: ${position.coords.latitude}, ${position.coords.longitude}`);
                            const latitude = position.coords.latitude;
                            const longitude = position.coords.longitude;
                            resolve({ latitude, longitude });
                        },
                        (err) => {
                            console.error("Geolocation error:", err);
                            reject(err);
                        },
                        { enableHighAccuracy: true },
                    )
                } else {
                    alert("Geolocation is not supported by this browser.");
                }
            })
        }

        // getUsersCurrentLocation().then((p) => console.log({ p }))

        let myCurrentLocationMarker = null

        async function main() {
            setInterval(async () => {
                const {latitude, longitude} = await getUsersCurrentLocation()
                socket.emit('client:location:update', { latitude, longitude })
                if (!myCurrentLocationMarker) {
                    map.setView(
                        [latitude, longitude],
                        15
                    );

                    L.marker([
                        latitude,
                        longitude,
                    ])
                        .addTo(map)
                        .bindPopup('You are here')
                        .openPopup();
                } else {
                    myCurrentLocationMarker.setLatLng([latitude, longitude])
                }
            }, 10*1000)

            // const userLocation = await getUsersCurrentLocation()

            map.setView(
                [userLocation.latitude, userLocation.longitude],
                15
            );

            L.marker([
                userLocation.latitude,
                userLocation.longitude
            ])
                .addTo(map)
                .bindPopup('You are here')
                .openPopup();
        }

        window.addEventListener('load', main)
    </script>
</body>

</html>
